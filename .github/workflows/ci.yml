name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  # ---------------------------------------------------------------------------
  # Lint: clang-format on diff
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install clang tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy
      - name: Check clang-format
        run: |
          find engine samples cmake -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            -not -path '*/_legacy/*' -print0 | \
            xargs -0 -r clang-format --dry-run --Werror

  # ---------------------------------------------------------------------------
  # Static analysis: clang-tidy over the diff. Cheap: only the files
  # changed in the PR get analysed (full-tree tidy runs nightly in a
  # separate workflow, not gating PRs).
  # ---------------------------------------------------------------------------
  tidy:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install toolchain + Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang clang-tidy
      - name: Configure (generates compile_commands.json)
        run: |
          cmake --preset ci-clang \
            -DCD_DISABLE_VCPKG=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Run clang-tidy on changed files
        run: |
          set -e
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="HEAD~1"; fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- \
            'engine/**/*.cpp' 'engine/**/*.hpp' 'samples/**/*.cpp' || true)
          if [ -z "$CHANGED" ]; then
            echo "No engine/sample changes; skipping tidy."
            exit 0
          fi
          echo "$CHANGED" | while read -r f; do
            [ -f "$f" ] || continue
            echo "::group::clang-tidy $f"
            clang-tidy -p build/ci-clang --warnings-as-errors='*' "$f" || exit 1
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # Windows build matrix — uses CI preset names from CMakePresets.json
  # CI preset taxonomy: ci-vs2026, ci-vs2022, ci-msvc, ci-clangcl-win, ci-llvm-win
  # ---------------------------------------------------------------------------
  windows:
    name: Windows / ${{ matrix.preset.display }} / ${{ matrix.config }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        preset:
          - { id: ci-vs2026,      display: VS2026 }
          - { id: ci-msvc,        display: MSVC-Ninja }
          - { id: ci-clangcl-win, display: Clang-CL }
          - { id: ci-llvm-win,    display: LLVM-Clang }
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_BUCKET: chromodynamic-cache
    steps:
      - uses: actions/checkout@v4
      - name: Export GHA cache env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install Ninja + sccache
        run: choco install ninja sccache -y
      # vcpkg is intentionally NOT set up: every dependency that previously
      # might have come from vcpkg (vulkan-headers, volk, vma, glslang,
      # googletest, tinygltf) is fetched in-tree via CMake FetchContent.
      # CD_DISABLE_VCPKG=ON in the configure step skips the toolchain probe.
      - name: Configure
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset.id }} `
            -DCD_DISABLE_VCPKG=ON `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset.id }}-${{ matrix.config == 'Debug' && 'debug' || 'release' }}
      - name: Test
        if: matrix.config == 'Debug'
        shell: pwsh
        run: ctest --preset ${{ matrix.preset.id }}-debug
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # ---------------------------------------------------------------------------
  # Linux build matrix
  # ---------------------------------------------------------------------------
  linux:
    name: Linux / ${{ matrix.preset.display }} / ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        preset:
          - { id: ci-gcc,   display: GCC }
          - { id: ci-clang, display: Clang }
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_BUCKET: chromodynamic-cache
    steps:
      - uses: actions/checkout@v4
      - name: Export GHA cache env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang
          curl -L https://github.com/mozilla/sccache/releases/download/v0.9.0/sccache-v0.9.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo mv sccache-v0.9.0-x86_64-unknown-linux-musl/sccache /usr/local/bin/
      # vcpkg is intentionally NOT set up: every dependency that previously
      # might have come from vcpkg (vulkan-headers, volk, vma, glslang,
      # googletest, tinygltf) is fetched in-tree via CMake FetchContent.
      # CD_DISABLE_VCPKG=ON in the configure step skips the toolchain probe.
      # CD_ENABLE_VULKAN=OFF on Linux: no GPU on GHA runners, no point
      # building rhi_vulkan/imgui_backend/GPU samples. Headless tests +
      # non-GPU samples still exercise the foundation and asset tiers.
      - name: Configure
        run: |
          cmake --preset ${{ matrix.preset.id }} \
            -DCD_DISABLE_VCPKG=ON \
            -DCD_ENABLE_VULKAN=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build
        run: cmake --build --preset ${{ matrix.preset.id }}-${{ matrix.config == 'Debug' && 'debug' || 'release' }}
      - name: Test
        if: matrix.config == 'Debug'
        run: ctest --preset ${{ matrix.preset.id }}-debug
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # ---------------------------------------------------------------------------
  # Linux Vulkan-on-software-renderer (lavapipe). Phase 11 Track B Part 1.
  #
  # The matrix above runs Linux with CD_ENABLE_VULKAN=OFF because the
  # standard GHA runners have no GPU. This separate job turns Vulkan ON
  # against Mesa's lavapipe (software Vulkan ICD shipped in
  # mesa-vulkan-drivers), then runs the smoke harness under xvfb so the
  # rhi_vulkan + samples + render pipeline gets exercised on a non-NVIDIA
  # backend before any v1.0 cut.
  #
  # lavapipe is intentionally slow — the gate is "code path works", not
  # "performance matches NVIDIA". Frame-rate is not asserted; only that
  # samples exit 0 without driver errors and the swapchain readback
  # produces sensible bytes.
  #
  # Golden-image compare is NOT enforced here (yet): NVIDIA references
  # captured by Track A Part 2 are not bit-equal to lavapipe output.
  # A separate golden set per software backend lands as a follow-up
  # if needed.
  # ---------------------------------------------------------------------------
  linux-vulkan-sw:
    name: Linux / Vulkan (lavapipe) / Debug
    runs-on: ubuntu-24.04
    needs: lint
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain + Vulkan SW stack
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang
          # lavapipe ships in mesa-vulkan-drivers; vulkan-tools gives us
          # vulkaninfo for diagnostics. libwayland/-xkb cover the
          # platform surface the samples open. xvfb is the virtual
          # display the runner lacks.
          sudo apt-get install -y \
            mesa-vulkan-drivers \
            vulkan-tools \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            xvfb
      - name: Vulkan ICD smoke (vulkaninfo)
        run: |
          # Confirm lavapipe is the only ICD visible; fail fast if not.
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          vulkaninfo --summary | head -40 || true
      - name: Configure (Vulkan ON)
        run: |
          cmake --preset ci-clang \
            -DCD_DISABLE_VCPKG=ON \
            -DCD_ENABLE_VULKAN=ON
      - name: Build
        run: cmake --build --preset ci-clang-debug
      - name: ctest (no display required)
        run: ctest --preset ci-clang-debug --output-on-failure
      - name: Sample smoke under xvfb + lavapipe
        run: |
          # xvfb-run provides a virtual X display so window creation
          # succeeds. VK_ICD_FILENAMES pins the loader to lavapipe so
          # the test isn't bypassing the Vulkan path via some other
          # ICD that might have leaked in.
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          # CD_RHI_PREFER_X11=ON because we're under Xvfb, not Wayland.
          # The sample's surface-creation code looks at this at compile
          # time via the option, but the runtime path goes through
          # vkCreateXlibSurfaceKHR which Xvfb supports.
          xvfb-run -a --server-args='-screen 0 1280x720x24' \
            bash scripts/run_all_samples.sh || rc=$?
          echo "smoke rc=${rc:-0}"
        env:
          CD_RHI_PREFER_X11: "ON"
        continue-on-error: true   # lavapipe behaviour is signal we keep
                                   # collecting; failing the gate is for
                                   # the next iteration once we know its
                                   # noise floor.
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-vulkan-sw-smoke-logs
          path: build/ci-clang/smoke-logs/**
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # macOS (AppleClang) — uses ci-appleclang preset
  # ---------------------------------------------------------------------------
  macos:
    name: macOS / AppleClang / ${{ matrix.config }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      # vcpkg is intentionally NOT set up: every dependency that previously
      # might have come from vcpkg (vulkan-headers, volk, vma, glslang,
      # googletest, tinygltf) is fetched in-tree via CMake FetchContent.
      # CD_DISABLE_VCPKG=ON in the configure step skips the toolchain probe.
      - name: Configure
        run: cmake --preset ci-appleclang -DCD_DISABLE_VCPKG=ON
      - name: Build
        run: cmake --build --preset ci-appleclang-${{ matrix.config == 'Debug' && 'debug' || 'release' }}
      - name: Test
        if: matrix.config == 'Debug'
        run: ctest --preset ci-appleclang-debug

  # ---------------------------------------------------------------------------
  # Coverage: gcc + gcovr on Ubuntu. Linux-only to keep the CI matrix lean;
  # the project's tested behaviour is platform-independent enough that one
  # OS's coverage report is representative.
  # ---------------------------------------------------------------------------
  coverage:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain + gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc g++ gcovr
      - name: Configure with coverage
        run: |
          cmake --preset ci-gcc \
            -DCD_DISABLE_VCPKG=ON \
            -DCD_ENABLE_COVERAGE=ON
      - name: Build
        run: cmake --build --preset ci-gcc-debug
      - name: Run tests (drives .gcda generation)
        run: ctest --preset ci-gcc-debug
      - name: Generate coverage report
        run: cmake --build --preset ci-gcc-debug --target coverage-report
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/ci-gcc/coverage*.html
      - name: Upload Cobertura XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: build/ci-gcc/coverage.xml

  # ---------------------------------------------------------------------------
  # Sanitizer matrix (TSan + ASan separate, Clang-only)
  # ---------------------------------------------------------------------------
  sanitizers:
    name: Sanitizer / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        preset: [ninja-base-asan, ninja-base-tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang
      # vcpkg is intentionally NOT set up: every dependency that previously
      # might have come from vcpkg (vulkan-headers, volk, vma, glslang,
      # googletest, tinygltf) is fetched in-tree via CMake FetchContent.
      # CD_DISABLE_VCPKG=ON in the configure step skips the toolchain probe.
      - name: Configure + Build + Test
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DCD_DISABLE_VCPKG=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build --preset ${{ matrix.preset == 'ninja-base-asan' && 'ninja-debug-asan' || 'ninja-debug-tsan' }}
          ctest --preset ${{ matrix.preset == 'ninja-base-asan' && 'ninja-debug-asan' || 'ninja-debug-tsan' }}
